<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071326">
  <meta name="description" content="Abre esto, porfis.">
  <title>Abre esto, porfis ♥</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071326'/%3E%3Cpath d='M32 53S8 39 8 22c0-12 15-16 24-5 9-11 24-7 24 5 0 17-24 31-24 31Z' fill='%23ef4455'/%3E%3Cpath d='M32 17v36M17 22l15 10 15-10M14 36h36' fill='none' stroke='%23fff' stroke-width='2' opacity='.8'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --night: #071326;
      --night-deep: #030814;
      --blue: #142d54;
      --sky: #8fc7ff;
      --red: #ee4055;
      --red-dark: #9f2138;
      --paper: #fffaf0;
      --ink: #17233b;
      --muted: #aebbd2;
      --ease-web: cubic-bezier(.2,.85,.24,1);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 78% 18%, rgba(143,199,255,.22) 0 1px, transparent 2px),
        radial-gradient(circle at 21% 14%, rgba(255,255,255,.75) 0 1px, transparent 1.7px),
        radial-gradient(circle at 15% 58%, rgba(255,255,255,.45) 0 1px, transparent 1.6px),
        radial-gradient(circle at 62% 48%, rgba(255,255,255,.4) 0 1px, transparent 1.5px),
        radial-gradient(circle at 84% 65%, rgba(255,255,255,.45) 0 1px, transparent 1.5px),
        radial-gradient(ellipse at 50% 0%, #183666 0%, var(--night) 48%, var(--night-deep) 100%);
      background-size: 240px 240px, 180px 180px, 270px 270px, 210px 210px, 320px 320px, 100% 100%;
    }

    button { font: inherit; }

    .app {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
    }

    .moon {
      position: absolute;
      top: clamp(34px, 6vw, 74px);
      right: clamp(24px, 8vw, 120px);
      width: clamp(72px, 10vw, 130px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #eaf6ff;
      box-shadow: 0 0 38px rgba(197,228,255,.35), 0 0 90px rgba(132,193,255,.16);
      opacity: .93;
      z-index: -3;
    }

    .moon::after {
      content: "";
      position: absolute;
      width: 80%;
      aspect-ratio: 1;
      top: -7%;
      left: -15%;
      border-radius: 50%;
      background: #132f59;
    }

    .sky-glow {
      position: absolute;
      inset: 0;
      z-index: -4;
      background: radial-gradient(circle at 50% 58%, rgba(238,64,85,.12), transparent 35%);
      pointer-events: none;
    }

    .web-corner {
      position: absolute;
      width: min(34vw, 360px);
      aspect-ratio: 1;
      top: -11%;
      left: -8%;
      z-index: -1;
      opacity: .15;
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 0 0, transparent 0 28px, rgba(255,255,255,.8) 30px 31px),
        repeating-conic-gradient(from 0deg at 0 0, rgba(255,255,255,.8) 0deg 1deg, transparent 1deg 24deg);
      transform: rotate(12deg);
      pointer-events: none;
    }

    .progress {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 15;
    }

    .progress span {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255,255,255,.22);
      transition: width .35s ease, background .35s ease, box-shadow .35s ease;
    }

    .progress span.active {
      width: 24px;
      background: var(--red);
      box-shadow: 0 0 18px rgba(238,64,85,.55);
    }

    .scene {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(72px, 8vw, 112px) clamp(22px, 5vw, 80px) clamp(76px, 8vw, 110px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(18px) scale(.985);
      transition: opacity .5s ease, transform .65s var(--ease-web), visibility .5s;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: none;
    }

    .intro-card {
      width: min(680px, 100%);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      color: #c8d7ec;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
      opacity: .42;
    }

    h1, h2, p { margin-top: 0; }

    .intro-card h1 {
      margin-bottom: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.15rem, 9vw, 7rem);
      font-weight: 500;
      line-height: .92;
      letter-spacing: -.055em;
      text-wrap: balance;
    }

    .intro-card h1 em {
      position: relative;
      display: inline-block;
      color: var(--red);
      font-weight: 500;
    }

    .intro-card h1 em::after {
      content: "";
      position: absolute;
      left: 3%;
      right: 3%;
      bottom: -.08em;
      height: .08em;
      background: currentColor;
      border-radius: 99px;
      transform: rotate(-2deg);
      opacity: .72;
    }

    .intro-card > p {
      max-width: 460px;
      margin: 0 auto 32px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    .primary-button,
    .restart-button {
      border: 0;
      cursor: pointer;
      color: #fff;
      background: var(--red);
      border-radius: 999px;
      font-weight: 800;
      min-height: 54px;
      padding: 0 28px;
      box-shadow: 0 12px 35px rgba(238,64,85,.28), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .primary-button:hover,
    .restart-button:hover {
      transform: translateY(-2px);
      background: #f25466;
      box-shadow: 0 16px 40px rgba(238,64,85,.38), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .primary-button:active,
    .restart-button:active { transform: translateY(1px) scale(.98); }

    .primary-button:focus-visible,
    .restart-button:focus-visible,
    .note:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    .story-stage {
      width: min(1080px, 100%);
      height: min(700px, 82svh);
      display: grid;
      grid-template-columns: minmax(260px, .88fr) minmax(320px, 1.12fr);
      align-items: center;
      gap: clamp(18px, 5vw, 74px);
    }

    .hero-wrap {
      position: relative;
      align-self: stretch;
      min-height: 450px;
      filter: drop-shadow(0 22px 26px rgba(0,0,0,.3));
    }

    .hero-web {
      position: absolute;
      top: -120px;
      left: 51%;
      width: 2px;
      height: 180px;
      background: linear-gradient(#fff, rgba(255,255,255,.35));
      box-shadow: 0 0 8px rgba(255,255,255,.5);
      transform-origin: top;
    }

    .hero-image {
      position: absolute;
      width: min(96%, 430px);
      height: auto;
      bottom: 0;
      left: 50%;
      object-fit: contain;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hero-one { animation: cat-arrive .9s var(--ease-web) both; }

    .hero-two {
      width: min(88%, 390px);
      opacity: 0;
      transform: translateX(-50%) translateY(24px) scale(.72);
    }

    .scene-story.second-message .hero-one { animation: cat-exit .6s ease both; }
    .scene-story.second-message .hero-two { animation: cat-pop .78s .18s var(--ease-web) both; }

    .story-copy {
      position: relative;
      perspective: 1200px;
    }

    .note {
      position: relative;
      width: 100%;
      min-height: 330px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 6vw, 68px);
      border: 0;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      background:
        linear-gradient(135deg, rgba(255,255,255,.96), rgba(255,250,240,.96)),
        var(--paper);
      border-radius: 8px 8px 34px 8px;
      box-shadow: 0 28px 70px rgba(0,0,0,.34), inset 0 0 0 1px rgba(51,63,86,.07);
      transform: rotate(1.4deg);
      transform-origin: 50% 0;
      transition: box-shadow .25s ease;
      overflow: hidden;
    }

    .note::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .26;
      background: repeating-linear-gradient(0deg, transparent 0 31px, rgba(28,69,111,.08) 31px 32px);
    }

    .note::after {
      content: "";
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, rgba(212,203,186,.42) 0 49%, #f2eadc 50%);
      border-radius: 12px 0 28px 0;
    }

    .note:hover { box-shadow: 0 34px 82px rgba(0,0,0,.42), inset 0 0 0 1px rgba(51,63,86,.08); }

    .note-kicker {
      position: relative;
      margin-bottom: 18px;
      color: var(--red-dark);
      font-size: .75rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .note-text {
      position: relative;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 3.2vw, 2.65rem);
      line-height: 1.22;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 22px 0 0 18px;
      color: rgba(224,233,246,.72);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .tap-hint i {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(238,64,85,.55);
      animation: pulse 1.8s infinite;
    }

    .note.is-flipping { animation: note-swing .82s var(--ease-web); }
    .note.is-flipping .note-content { animation: text-swap .82s ease; }

    .final-content {
      width: min(860px, 100%);
      text-align: center;
      position: relative;
    }

    .final-cat {
      position: absolute;
      right: clamp(-72px, -5vw, -34px);
      bottom: -115px;
      width: clamp(132px, 19vw, 218px);
      height: auto;
      transform: rotate(7deg);
      filter: drop-shadow(0 16px 20px rgba(0,0,0,.3));
      pointer-events: none;
      user-select: none;
    }

    .final-heart {
      position: relative;
      width: clamp(62px, 10vw, 94px);
      aspect-ratio: 1;
      margin: 0 auto 28px;
      transform: rotate(45deg);
      border-radius: 16px 8px 16px 8px;
      background: var(--red);
      box-shadow: 0 0 48px rgba(238,64,85,.38);
      animation: heart-beat 1.2s ease-in-out infinite;
    }

    .final-heart::before,
    .final-heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .final-heart::before { left: -50%; }
    .final-heart::after { top: -50%; }

    .final-label {
      margin-bottom: 14px;
      color: #c7d7ec;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .final-content h2 {
      margin-bottom: 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 500;
      line-height: .96;
      letter-spacing: -.06em;
      text-wrap: balance;
    }

    .final-content h2 span { color: var(--red); }

    .final-content > p {
      margin-bottom: 30px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .restart-button {
      min-height: 48px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: none;
      backdrop-filter: blur(12px);
    }

    .restart-button:hover { background: rgba(255,255,255,.16); box-shadow: none; }

    .skyline {
      position: absolute;
      z-index: -2;
      left: -2%;
      right: -2%;
      bottom: 0;
      height: clamp(90px, 19vh, 190px);
      opacity: .84;
      background:
        linear-gradient(90deg,
          #030712 0 5%, transparent 5% 7%, #040914 7% 13%, transparent 13% 15%,
          #030712 15% 23%, transparent 23% 25%, #040914 25% 31%, transparent 31% 32%,
          #030712 32% 43%, transparent 43% 45%, #040914 45% 51%, transparent 51% 53%,
          #030712 53% 63%, transparent 63% 65%, #040914 65% 72%, transparent 72% 74%,
          #030712 74% 84%, transparent 84% 86%, #040914 86% 93%, transparent 93% 95%, #030712 95% 100%);
      clip-path: polygon(0 45%,5% 45%,5% 25%,11% 25%,11% 39%,17% 39%,17% 10%,23% 10%,23% 50%,29% 50%,29% 30%,35% 30%,35% 44%,42% 44%,42% 18%,49% 18%,49% 50%,56% 50%,56% 31%,63% 31%,63% 9%,70% 9%,70% 46%,77% 46%,77% 20%,85% 20%,85% 39%,91% 39%,91% 28%,97% 28%,97% 46%,100% 46%,100% 100%,0 100%);
    }

    .web-wipe {
      position: fixed;
      z-index: 100;
      inset: -25vmax;
      pointer-events: none;
      opacity: 0;
      transform: scale(.12) rotate(-18deg);
      border-radius: 50%;
      background:
        repeating-radial-gradient(circle at center, transparent 0 6.5vmin, rgba(231,242,255,.96) 6.7vmin 7vmin),
        repeating-conic-gradient(from 0deg at center, rgba(231,242,255,.98) 0deg .7deg, transparent .7deg 20deg),
        radial-gradient(circle, rgba(17,43,80,.98) 0 66%, rgba(5,13,28,.98) 76%);
      filter: drop-shadow(0 0 18px rgba(194,225,255,.35));
    }

    .web-wipe.active { animation: web-cover .9s var(--ease-web) both; }

    .scene-final.active .final-content { animation: final-rise .9s .12s var(--ease-web) both; }

    .scene-story.leaving .hero-two { animation: cat-swing-away .85s var(--ease-web) both; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes web-cover {
      0% { opacity: 0; transform: scale(.12) rotate(-18deg); }
      42% { opacity: 1; transform: scale(1.05) rotate(0deg); }
      58% { opacity: 1; transform: scale(1.05) rotate(0deg); }
      100% { opacity: 0; transform: scale(2.2) rotate(12deg); }
    }

    @keyframes cat-arrive {
      from { opacity: 0; transform: translateX(-50%) translateY(-42%) rotate(-8deg) scale(.72); }
      72% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(2deg) scale(1.04); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) rotate(0) scale(1); }
    }

    @keyframes cat-exit {
      from { opacity: 1; transform: translateX(-50%) translateY(0) rotate(0) scale(1); }
      to { opacity: 0; transform: translateX(-92%) translateY(8%) rotate(-9deg) scale(.78); }
    }

    @keyframes cat-pop {
      0% { opacity: 0; transform: translateX(-50%) translateY(24px) scale(.72); }
      70% { opacity: 1; transform: translateX(-50%) translateY(-7px) scale(1.05); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    @keyframes cat-swing-away {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-120%) translateY(-25%) rotate(-36deg) scale(.78); opacity: 0; }
    }

    @keyframes note-swing {
      0% { transform: rotate(1.4deg) rotateY(0); }
      35% { transform: rotate(-5deg) rotateY(10deg); }
      68% { transform: rotate(3deg) rotateY(-4deg); }
      100% { transform: rotate(1.4deg) rotateY(0); }
    }

    @keyframes text-swap {
      0%,28% { opacity: 1; transform: translateY(0); }
      48% { opacity: 0; transform: translateY(10px); }
      62% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes final-rise {
      from { opacity: 0; transform: translateY(24px) scale(.96); }
      to { opacity: 1; transform: none; }
    }

    @keyframes heart-beat {
      0%,100% { transform: rotate(45deg) scale(1); }
      35% { transform: rotate(45deg) scale(1.1); }
      52% { transform: rotate(45deg) scale(1.03); }
      70% { transform: rotate(45deg) scale(1.1); }
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(238,64,85,.55); }
      50% { box-shadow: 0 0 0 7px rgba(238,64,85,0); }
    }

    @media (max-width: 760px) {
      .app { min-height: 600px; }
      .moon { top: 64px; right: 18px; }
      .scene { padding: 58px 18px 64px; }
      .story-stage {
        height: 100%;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(245px, 44%) auto;
        gap: 0;
      }
      .hero-wrap { min-height: 240px; align-self: stretch; }
      .hero-image { width: min(58vw, 255px); bottom: -4px; left: 51%; }
      .hero-two { width: min(54vw, 238px); }
      .hero-web { top: -210px; height: 245px; }
      .story-copy { align-self: start; width: min(520px, 100%); margin: 0 auto; }
      .note { min-height: 250px; padding: 30px 28px 34px; border-radius: 7px 7px 26px 7px; }
      .note-text { font-size: clamp(1.35rem, 6vw, 1.85rem); }
      .tap-hint { margin-top: 14px; }
      .skyline { height: 110px; }
      .final-cat { width: 118px; right: -24px; bottom: -96px; }
    }

    @media (max-height: 680px) and (min-width: 761px) {
      .story-stage { height: 540px; }
      .hero-wrap { min-height: 400px; }
      .note { min-height: 285px; }
      .note-text { font-size: clamp(1.45rem, 3vw, 2.1rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="sky-glow" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="web-corner" aria-hidden="true"></div>

    <div class="progress" aria-label="Progreso">
      <span class="active"></span><span></span><span></span><span></span>
    </div>

    <section class="scene scene-intro active" data-step="0" aria-labelledby="intro-title">
      <div class="intro-card">
        <div class="eyebrow">mensaje entrante</div>
        <h1 id="intro-title">Abre esto, <em>porfis</em></h1>
        <p>Un pequeño héroe nocturno insistió en traerte algo. Prometo que solo tomará un momento.</p>
        <button class="primary-button" id="startButton" type="button">Abrir&nbsp; →</button>
      </div>
    </section>

    <section class="scene scene-story" data-step="1" aria-label="Mensaje">
      <div class="story-stage">
        <div class="hero-wrap" aria-hidden="true">
          <div class="hero-web"></div>
          <img class="hero-image hero-one" src="gatito-heroe.png" alt="" width="1254" height="1254">
          <img class="hero-image hero-two" src="gatito-ternura.png" alt="" width="1254" height="1254">
        </div>
        <div class="story-copy">
          <button class="note" id="noteButton" type="button" aria-label="Continuar al siguiente mensaje">
            <span class="note-content">
              <span class="note-kicker" id="noteKicker">Una confesión</span>
              <span class="note-text" id="noteText">Quizás no eres Jean Grey, pero no consigues salir de mi cabeza.</span>
            </span>
          </button>
          <p class="tap-hint"><i aria-hidden="true"></i><span id="tapHint">Toca el cartel para continuar</span></p>
        </div>
      </div>
    </section>

    <section class="scene scene-final" data-step="3" aria-labelledby="final-title">
      <div class="final-content">
        <img class="final-cat" src="gatito-ternura.png" alt="" width="1254" height="1254" aria-hidden="true">
        <div class="final-heart" aria-hidden="true"></div>
        <p class="final-label">Y por si aún no estaba claro…</p>
        <h2 id="final-title">Te quiero un <span>montón</span>.</h2>
        <p>Eso era todo. Bueno… todo por ahora ♥</p>
        <button class="restart-button" id="restartButton" type="button">Ver otra vez</button>
      </div>
    </section>

    <div class="skyline" aria-hidden="true"></div>
    <div class="web-wipe" id="webWipe" aria-hidden="true"></div>
    <p class="sr-only" id="liveMessage" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const scenes = [...document.querySelectorAll('.scene')];
      const dots = [...document.querySelectorAll('.progress span')];
      const storyScene = document.querySelector('.scene-story');
      const note = document.getElementById('noteButton');
      const noteKicker = document.getElementById('noteKicker');
      const noteText = document.getElementById('noteText');
      const tapHint = document.getElementById('tapHint');
      const wipe = document.getElementById('webWipe');
      const live = document.getElementById('liveMessage');
      let step = 0;
      let locked = false;

      const copy = {
        first: {
          kicker: 'Una confesión',
          text: 'Quizás no eres Jean Grey, pero no consigues salir de mi cabeza.'
        },
        second: {
          kicker: 'Para este sábado',
          text: 'Espero poder verte este sábado, como dijimos. Eres increíble, asombrosa, muy talentosa y me llenas de orgullo.'
        }
      };

      function setActiveScene(targetStep) {
        scenes.forEach((scene) => {
          const sceneStep = Number(scene.dataset.step);
          const active = targetStep === 2 ? sceneStep === 1 : sceneStep === targetStep;
          scene.classList.toggle('active', active);
          scene.setAttribute('aria-hidden', active ? 'false' : 'true');
        });
        dots.forEach((dot, index) => dot.classList.toggle('active', index === targetStep));
      }

      function runWipe(callback) {
        locked = true;
        wipe.classList.remove('active');
        void wipe.offsetWidth;
        wipe.classList.add('active');
        window.setTimeout(callback, 390);
        window.setTimeout(() => {
          wipe.classList.remove('active');
          locked = false;
        }, 920);
      }

      function startStory() {
        if (locked || step !== 0) return;
        runWipe(() => {
          step = 1;
          setActiveScene(step);
          live.textContent = copy.first.text;
          window.setTimeout(() => note.focus({ preventScroll: true }), 300);
        });
      }

      function showSecondNote() {
        if (locked || step !== 1) return;
        locked = true;
        note.classList.add('is-flipping');
        window.setTimeout(() => {
          storyScene.classList.add('second-message');
          noteKicker.textContent = copy.second.kicker;
          noteText.textContent = copy.second.text;
          tapHint.textContent = 'Un toque más';
          step = 2;
          dots.forEach((dot, index) => dot.classList.toggle('active', index === step));
          live.textContent = copy.second.text;
        }, 390);
        window.setTimeout(() => {
          note.classList.remove('is-flipping');
          locked = false;
        }, 840);
      }

      function showFinal() {
        if (locked || step !== 2) return;
        storyScene.classList.add('leaving');
        runWipe(() => {
          step = 3;
          setActiveScene(step);
          live.textContent = 'Te quiero un montón.';
          storyScene.classList.remove('leaving');
          window.setTimeout(() => document.getElementById('restartButton').focus({ preventScroll: true }), 300);
        });
      }

      function restart() {
        if (locked) return;
        runWipe(() => {
          step = 0;
          noteKicker.textContent = copy.first.kicker;
          noteText.textContent = copy.first.text;
          tapHint.textContent = 'Toca el cartel para continuar';
          storyScene.classList.remove('second-message', 'leaving');
          setActiveScene(step);
          live.textContent = 'La historia ha vuelto a comenzar.';
          window.setTimeout(() => document.getElementById('startButton').focus({ preventScroll: true }), 300);
        });
      }

      document.getElementById('startButton').addEventListener('click', startStory);
      note.addEventListener('click', () => step === 1 ? showSecondNote() : showFinal());
      document.getElementById('restartButton').addEventListener('click', restart);

      document.addEventListener('keydown', (event) => {
        if (!['Enter', ' ', 'ArrowRight'].includes(event.key)) return;
        if (event.target.tagName === 'BUTTON') return;
        event.preventDefault();
        if (step === 0) startStory();
        else if (step === 1) showSecondNote();
        else if (step === 2) showFinal();
      });
    })();
  </script>
</body>
</html>
